<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Video</title>

<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://www.youtube.com">

<!-- Favicon (inline SVG, swapped by JS) -->
<link id="favicon" rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='5'%20fill='%23000'/%3E%3Ccircle%20cx='12'%20cy='12'%20r='4'%20fill='%23fff'/%3E%3C/svg%3E">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    font-family: "Segoe UI", "Microsoft Sans Serif", Tahoma, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Background stage (YouTube video only) ---------- */
  #stage {
    position: fixed; inset: 0; z-index: 1;
    overflow: hidden; background: #000;
    transition: filter .45s ease;
  }
  #stage.blur { filter: blur(14px) brightness(.5); }

  #ytwrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    /* size is set by JS to cover the viewport and crop YouTube UI */
  }
  #yt {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  #yt iframe {
    position: absolute; inset: 0;
    width: 100% !important; height: 100% !important;
    border: 0; pointer-events: none;
  }

  /* ---------- Transparent tap catcher ---------- */
  #catch {
    position: fixed; inset: 0; z-index: 5;
    background: transparent;
    touch-action: manipulation;
  }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 20; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .6s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #track {
    width: min(80vw, 480px); height: 8px;
    background: rgba(255,255,255,.15);
    border-radius: 4px; overflow: hidden;
  }
  #fill { width: 0%; height: 100%; background: #fff; transition: width .3s ease; }
  #status {
    margin-top: 12px; color: #ccc; font-size: 14px; letter-spacing: .3px;
    text-align: center; padding: 0 20px;
  }

  /* ---------- Game menu ---------- */
  #menu { position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.25); }
  #menu.hidden { display: none; }
  .panel {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: min(84vw, 340px); padding: 36px 20px 18px;
    background: rgba(28,28,36,.95);
    display: flex; flex-direction: column;
    box-shadow: 2px 0 24px rgba(0,0,0,.6);
  }
  .menu-logo {
    display: block; width: 120px; height: auto;
    margin: 0 0 24px 12px;
    image-rendering: -webkit-optimize-contrast;
  }
  #items { list-style: none; margin: 0; padding: 0; flex: 1 1 auto; overflow-y: auto; }
  #items li {
    padding: 13px 16px; margin-bottom: 6px; color: #ddd; font-size: 16px;
    cursor: pointer; border-radius: 3px;
    transition: background .15s, color .15s;
  }
  #items li:hover { background: rgba(255,255,255,.10); }
  #items li.sel { background: linear-gradient(90deg, #fff, #b5b5b5); color: #000; }
  .hint { color: rgba(255,255,255,.6); font-size: 12px; letter-spacing: .5px; padding: 14px 12px 0; }
  .menu-close {
    position: absolute; top: 12px; right: 12px;
    width: 38px; height: 38px; padding: 0;
    border: 0; border-radius: 6px; background: transparent;
    color: #ddd; font-size: 18px; line-height: 1; cursor: pointer;
  }
  .menu-close:hover { background: rgba(255,255,255,.12); color: #fff; }

  /* ---------- Notice window ---------- */
  #wizard {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 40; width: min(92vw, 420px); background: #f0f0f0;
    border: 1px solid #0078d7; box-shadow: 0 8px 30px rgba(0,0,0,.5); color: #000;
  }
  #wizard.closed { display: none; }
  .titlebar {
    display: flex; align-items: center; gap: 4px;
    height: 32px; padding: 0 0 0 6px;
    background: #0078d7; color: #fff; font-size: 12px;
  }
  .titlebar .title { flex: 1; margin-left: 4px; }
  .icon-btn {
    width: 30px; height: 30px; padding: 0;
    border: 0; border-radius: 4px;
    background: transparent; color: #fff;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.22); }
  .icon-btn svg { width: 20px; height: 20px; }
  .wizard-body { padding: 18px 16px 14px; font-size: 13px; line-height: 1.5; }
  .wizard-body p { margin: 0; }
  .wizard-footer { display: flex; justify-content: flex-end; padding: 10px 16px 14px; }
  .wizard-footer button {
    min-width: 84px; height: 26px; padding: 0 12px; border: 1px solid #adadad;
    background: #e1e1e1; font-family: inherit; font-size: 12px; cursor: pointer; color: #000;
  }
  .wizard-footer button:hover { background: #e5f1fb; border-color: #0078d7; }

  /* ---------- Sound button ---------- */
  #sound-btn {
    position: fixed; top: 12px; right: 12px; z-index: 30;
    width: 44px; height: 44px; padding: 0; border: none; border-radius: 8px;
    background: rgba(0,0,0,.6); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  #sound-btn:hover { background: rgba(0,0,0,.85); }
  #sound-btn svg { width: 24px; height: 24px; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 108px; transform: translate(-50%, 12px);
    z-index: 45; max-width: 88vw; padding: 10px 18px; border-radius: 999px;
    background: rgba(20,20,26,.94); color: #fff; font-size: 13px; letter-spacing: .3px;
    border: 1px solid rgba(255,255,255,.16); text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- On-screen gamepad ---------- */
  #pad {
    position: fixed; left: 0; right: 0; bottom: 16px; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; pointer-events: none;
  }
  .group { pointer-events: auto; }
  .dpad, .face {
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(3, 50px);
    gap: 4px;
  }
  #up    { grid-column: 2; grid-row: 1; }
  #left  { grid-column: 1; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #down  { grid-column: 2; grid-row: 3; }
  #y { grid-column: 2; grid-row: 1; --c: #2ecc40; }
  #x { grid-column: 1; grid-row: 2; --c: #ff4136; }
  #b { grid-column: 3; grid-row: 2; --c: #0074d9; }
  #a { grid-column: 2; grid-row: 3; --c: #ffdc00; }
  .btn {
    width: 50px; height: 50px;
    border: 2px solid var(--c, rgba(255,255,255,.7));
    border-radius: 50%; background: rgba(0,0,0,.5); color: var(--c, #fff);
    font-size: 18px; font-weight: bold; cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .btn.pill {
    border-radius: 25px; width: 70px; height: 30px;
    font-size: 12px; border-color: rgba(255,255,255,.7);
    color: #fff; --c: none;
  }
  .btn:active, .btn.active { background: var(--c, rgba(255,255,255,.35)); color: #000; }
  .btn.pill:active, .btn.pill.active { background: rgba(255,255,255,.35); color: #fff; }
  .center {
    display: flex; flex-direction: column; gap: 8px;
    align-self: center; pointer-events: auto;
  }

  /* ---------- Accessibility & responsive ---------- */
  :focus-visible { outline: 2px solid #ff7aa8; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
  @media (max-width: 520px) {
    .dpad, .face { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
    .btn { width: 44px; height: 44px; font-size: 16px; }
    .btn.pill { width: 62px; height: 28px; font-size: 11px; }
    #toast { bottom: 128px; }
  }
</style>
</head>
<body>

  <!-- Stage: YouTube video fills this, UI cropped off-screen -->
  <div id="stage">
    <div id="ytwrap">
      <div id="yt"></div>
    </div>
  </div>

  <!-- Transparent layer: catches double-taps, blocks YouTube hover UI -->
  <div id="catch"></div>

  <div id="loader" role="status" aria-live="polite">
    <div id="track"><div id="fill"></div></div>
    <div id="status">Loading video… 0%</div>
  </div>

  <!-- Menu -->
  <div id="menu" class="hidden">
    <div class="panel">
      <button id="menu-close" class="menu-close" aria-label="Close menu">✕</button>
      <img class="menu-logo" src="https://files.catbox.moe/dfjd81.png" alt="Menu">
      <ul id="items"></ul>
      <div class="hint">↵ / A select &nbsp;·&nbsp; Esc / B back</div>
    </div>
  </div>

  <!-- Notice window with sound & close controls -->
  <div id="wizard" class="closed" role="dialog" aria-modal="true" aria-labelledby="wiz-title">
    <div class="titlebar">
      <button id="wiz-sound-btn" class="icon-btn" aria-label="Toggle sound" title="Toggle sound (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>
      <span class="title" id="wiz-title">Notice</span>
      <button id="close-btn" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div class="wizard-body">
      <p>Edit this message here. It appears in the notice window.<br>
         Sound: 🔊 top-right (or press <b>M</b>). Menu: <b>double‑tap</b> the screen, <b>Enter</b> or <b>START</b>.</p>
    </div>
    <div class="wizard-footer">
      <button id="ok-btn">OK</button>
    </div>
  </div>

  <!-- Global sound button -->
  <button id="sound-btn" aria-label="Sound off" title="Toggle sound (M)">
    <svg id="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    </svg>
    <svg id="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <line x1="23" y1="9" x2="17" y2="15"/>
      <line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
  </button>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- On-screen gamepad -->
  <div id="pad">
    <div class="group dpad">
      <button class="btn" id="up" data-action="up" aria-label="Up">▲</button>
      <button class="btn" id="left" data-action="left" aria-label="Left">◀</button>
      <button class="btn" id="right" data-action="right" aria-label="Right">▶</button>
      <button class="btn" id="down" data-action="down" aria-label="Down">▼</button>
    </div>
    <div class="center">
      <button class="btn pill" id="select" data-action="select">SELECT</button>
      <button class="btn pill" id="start" data-action="start">START</button>
    </div>
    <div class="group face">
      <button class="btn" id="y" data-action="y">Y</button>
      <button class="btn" id="x" data-action="x">X</button>
      <button class="btn" id="b" data-action="b">B</button>
      <button class="btn" id="a" data-action="a">A</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ======================= Config ======================= */
  const YT_ID = 'ARwju5Gyk64';           // 47‑minute video, embedded directly
  const MENU_ITEMS = ['Resume', 'Gallery', 'Store', 'Help', 'Options'];
  const DOUBLE_TAP_MS = 300;

  /* ======================= Refs ======================= */
  const $ = (id) => document.getElementById(id);
  const stage     = $('stage');
  const ytwrap    = $('ytwrap');
  const loader    = $('loader');
  const fill      = $('fill');
  const statusEl  = $('status');
  const soundBtn  = $('sound-btn');
  const iconOn    = $('icon-on');
  const iconOff   = $('icon-off');
  const favicon   = $('favicon');
  const wizard    = $('wizard');
  const menu      = $('menu');
  const itemsEl   = $('items');
  const toastEl   = $('toast');

  /* ======================= State ======================= */
  let player     = null;
  let ytReady    = false;
  let ytPlaying  = false;
  let ytFailed   = false;
  let muted      = true;          // start muted → autoplay is always allowed
  let menuOpen   = false;
  let sel        = 0;
  let loaderDone = false;
  let hintShown  = false;

  /* ======================= Favicons ======================= */
  const SPEAKER = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#fff" stroke="none"/>';
  function wrapSvg(inner) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
             '<rect width="24" height="24" rx="5" fill="#000"/>' +
             '<g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
               inner +
             '</g>' +
           '</svg>';
  }
  const ICONS = {
    loading: wrapSvg('<circle cx="12" cy="12" r="7" stroke-opacity=".3"/><path d="M19 12a7 7 0 0 0-7-7"/>'),
    on:      wrapSvg(SPEAKER + '<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.9a9 9 0 0 1 0 12.2"/>'),
    off:     wrapSvg(SPEAKER + '<line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/>'),
    paused:  wrapSvg('<rect x="7" y="5" width="4" height="14" rx="1" fill="#fff" stroke="none"/>' +
                     '<rect x="14" y="5" width="4" height="14" rx="1" fill="#fff" stroke="none"/>')
  };
  function setFavicon(name) {
    const url = 'data:image/svg+xml,' + encodeURIComponent(ICONS[name] || ICONS.loading);
    if (favicon.getAttribute('href') !== url) favicon.setAttribute('href', url);
  }
  function updateFavicon() {
    if (!loaderDone) return setFavicon('loading');
    if (menuOpen)    return setFavicon('paused');
    setFavicon(muted ? 'off' : 'on');
  }

  /* ======================= Toast ======================= */
  let toastTimer = null;
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 2800);
  }

  /* ======================= Notice window ======================= */
  function openWizard()  { wizard.classList.remove('closed'); }
  function closeWizard() {
    wizard.classList.add('closed');
    if (!hintShown) {
      hintShown = true;
      toast('Double‑tap to open the menu · 🔊 for sound', 4200);
    }
  }
  $('close-btn').addEventListener('click', closeWizard);
  $('ok-btn').addEventListener('click', closeWizard);

  /* ======================= Sound ======================= */
  function updateSoundUI() {
    iconOn.hidden  = muted;
    iconOff.hidden = !muted;
    soundBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
    soundBtn.title = muted ? 'Turn sound on (M)' : 'Turn sound off (M)';
    updateFavicon();
  }
  function applySound() {
    if (!ytReady || ytFailed) return;
    try { muted ? player.mute() : player.unMute(); } catch (e) {}
    updateSoundUI();
  }
  function ensureAudible() {
    if (muted) return;
    if (ytReady && !ytFailed) { try { player.unMute(); } catch (e) {} }
  }
  function toggleSound() {
    muted = !muted;
    applySound();
    toast(muted ? 'Sound off' : 'Sound on');
  }
  soundBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleSound(); });
  $('wiz-sound-btn').addEventListener('click', function (e) { e.stopPropagation(); toggleSound(); });
  updateSoundUI();

  /* ======================= Cover the viewport with the 16:9 player ======================= */
  function sizeStage() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const ratio = 16 / 9;
    let width, height;
    if (w / h > ratio) { width = w; height = w / ratio; }
    else               { height = h; width = h * ratio; }

    // Oversize so YouTube's titlebar / share / controls sit off‑screen.
    const crop = 1.30;
    width  *= crop;
    height *= crop;

    ytwrap.style.width  = width  + 'px';
    ytwrap.style.height = height + 'px';
  }
  sizeStage();
  window.addEventListener('resize', sizeStage);
  window.addEventListener('orientationchange', sizeStage);

  /* ======================= Loader ======================= */
  function setProgress(pct) {
    fill.style.width = pct + '%';
    statusEl.textContent = 'Loading video… ' + pct + '%';
  }
  function hideLoader(msg) {
    if (loaderDone) return;
    loaderDone = true;
    fill.style.width = '100%';
    statusEl.textContent = msg || 'Ready';
    setTimeout(function () { loader.classList.add('hide'); }, msg ? 1800 : 300);
    updateFavicon();
    setTimeout(openWizard, 700);
  }
  setTimeout(function () { hideLoader(); }, 30000);   // safety net

  /* ======================= YouTube engine ======================= */
  function loadYouTubeAPI(cb) {
    if (window.YT && window.YT.Player) return cb();
    if (!window.__ytCbs) {
      window.__ytCbs = [];
      window.onYouTubeIframeAPIReady = function () {
        const cbs = window.__ytCbs || [];
        window.__ytCbs = [];
        cbs.forEach(function (fn) { try { fn(); } catch (e) {} });
      };
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      s.async = true;
      document.head.appendChild(s);
    }
    window.__ytCbs.push(cb);
  }

  function startYouTube() {
    if (player || ytFailed) return;
    loadYouTubeAPI(function () {
      player = new YT.Player('yt', {
        width: '100%',
        height: '100%',
        videoId: YT_ID,
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          autoplay: 1,
          mute: 1,             // required for autoplay
          controls: 0,         // ← no player buttons
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          playsinline: 1,
          loop: 1,
          playlist: YT_ID,
          enablejsapi: 1,
          origin: location.origin
        },
        events: {
          onReady: function (e) {
            ytReady = true;
            try { e.target.mute(); } catch (err) {}
            try { e.target.playVideo(); } catch (err) {}
            applySound();
            setProgress(60);
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING) {
              ytPlaying = true;
              setProgress(100);
              hideLoader();
            }
            if (e.data === YT.PlayerState.ENDED) {
              try { e.target.seekTo(0); e.target.playVideo(); } catch (err) {}
            }
          },
          onError: function () {
            ytFailed = true;
            hideLoader('Background video unavailable — check the video ID or embedding permissions.');
          }
        }
      });
    });
  }
  startYouTube();

  /* ======================= Menu ======================= */
  function renderMenu() {
    itemsEl.innerHTML = MENU_ITEMS.map(function (t, i) {
      return '<li data-i="' + i + '" class="' + (i === sel ? 'sel' : '') + '">' + t + '</li>';
    }).join('');
  }
  function openMenu() {
    if (menuOpen) return;
    menuOpen = true;
    menu.classList.remove('hidden');
    stage.classList.add('blur');
    // Keep the YouTube video playing (no pause) so its UI stays hidden.
    updateFavicon();
  }
  function closeMenu() {
    if (!menuOpen) return;
    menuOpen = false;
    menu.classList.add('hidden');
    stage.classList.remove('blur');
    updateFavicon();
  }
  function moveSel(step) {
    sel = (sel + step + MENU_ITEMS.length) % MENU_ITEMS.length;
    renderMenu();
  }
  function activateSel() {
    const name = MENU_ITEMS[sel];
    if (name === 'Resume') { closeMenu(); return; }
    if (name === 'Help')   { closeMenu(); openWizard(); return; }
    toast(name + ' — coming soon');
  }
  itemsEl.addEventListener('click', function (e) {
    const li = e.target.closest('li');
    if (!li) return;
    sel = Number(li.dataset.i);
    renderMenu();
    activateSel();
  });
  menu.addEventListener('click', function (e) { if (e.target === menu) closeMenu(); });
  $('menu-close').addEventListener('click', function (e) { e.stopPropagation(); closeMenu(); });
  renderMenu();

  /* ======================= Double‑tap to open menu ======================= */
  let lastTap = 0;
  $('catch').addEventListener('pointerdown', function (e) {
    const now = Date.now();
    if (now - lastTap < DOUBLE_TAP_MS) {
      e.preventDefault();
      goFullscreen();
      openMenu();
      lastTap = 0;
    } else {
      lastTap = now;
    }
  });

  /* ======================= Fullscreen + first‑tap helpers ======================= */
  function goFullscreen() {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    try {
      const r = req.call(el);
      if (r && r.catch) r.catch(function () {});
    } catch (e) {}
  }
  document.addEventListener('pointerdown', function () {
    goFullscreen();
    ensureAudible();
    if (!ytPlaying && ytReady && !ytFailed) {
      try { player.playVideo(); } catch (e) {}
    }
  }, { capture: true });

  /* ======================= Input: pad + keyboard ======================= */
  const KEYMAP = {
    'ArrowUp': 'up', 'w': 'up', 'W': 'up',
    'ArrowDown': 'down', 's': 'down', 'S': 'down',
    'ArrowLeft': 'left', 'a': 'left', 'A': 'left',
    'ArrowRight': 'right', 'd': 'right', 'D': 'right',
    'j': 'a', 'J': 'a', 'k': 'b', 'K': 'b',
    'l': 'y', 'L': 'y', 'i': 'x', 'I': 'x',
    'Enter': 'start', 'Shift': 'select'
  };
  function handleAction(action) {
    if (!wizard.classList.contains('closed')) {
      if (action === 'a' || action === 'b' || action === 'start') closeWizard();
      return;
    }
    if (menuOpen) {
      if (action === 'up') moveSel(-1);
      else if (action === 'down') moveSel(1);
      else if (action === 'a' || action === 'start') activateSel();
      else if (action === 'b') closeMenu();
      return;
    }
    if (action === 'start') { openMenu(); return; }
    onPress(action);
  }
  function onPress(action)   { console.log('press', action); }
  function onRelease(action) { console.log('release', action); }

  document.querySelectorAll('#pad .btn').forEach(function (btn) {
    const action = btn.dataset.action;
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      goFullscreen();
      ensureAudible();
      btn.classList.add('active');
      handleAction(action);
    });
    function release() {
      if (!btn.classList.contains('active')) return;
      btn.classList.remove('active');
      if (!menuOpen) onRelease(action);
    }
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  const pressed = new Set();
  document.addEventListener('keydown', function (e) {
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleSound(); return; }
    if (e.key === 'Escape') {
      if (!wizard.classList.contains('closed')) closeWizard();
      else closeMenu();
      return;
    }
    const action = KEYMAP[e.key];
    if (!action) return;
    e.preventDefault();
    goFullscreen();
    ensureAudible();
    if (pressed.has(action)) return;
    pressed.add(action);
    const el = document.querySelector('#pad [data-action="' + action + '"]');
    if (el) el.classList.add('active');
    handleAction(action);
  });
  document.addEventListener('keyup', function (e) {
    const action = KEYMAP[e.key];
    if (!action) return;
    pressed.delete(action);
    const el = document.querySelector('#pad [data-action="' + action + '"]');
    if (el) el.classList.remove('active');
    if (!menuOpen) onRelease(action);
  });

  /* ======================= Boot ======================= */
  setFavicon('loading');
})();
</script>
</body>
</html>
